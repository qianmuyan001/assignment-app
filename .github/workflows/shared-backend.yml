name: Shared and backend

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check cross-platform version metadata
        run: python scripts/check_version_sync.py

      - name: Check Python errors with Pylint
        run: python -m pylint --errors-only $(git ls-files '*.py')

      - name: Run shared contract and migration tests
        run: python -m unittest discover -s shared/tests -v

      - name: Run isolated backend API and Web asset tests
        run: python -m unittest discover -s backend/tests -v
