name: Apple iPad and Catalyst

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    # The project is authored by Xcode 27 (objectVersion 110). GitHub's
    # macos-26 image currently selects Xcode 26.x, so use the dedicated
    # arm64 Xcode 27 preview image until that toolchain becomes GA.
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      ASSIGNMENT_DERIVED_DATA: ${{ runner.temp }}/assignment-app-derived-data
    steps:
      - uses: actions/checkout@v4

      - name: Record Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun swift --version
          xcodebuild -showsdks

      - name: Check cross-platform version metadata
        run: python3 scripts/check_version_sync.py

      - name: Create an iPad simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list runtimes -j > "$RUNNER_TEMP/runtimes.json"
          xcrun simctl list devicetypes -j > "$RUNNER_TEMP/device-types.json"
          RUNTIME_ID="$(python3 - "$RUNNER_TEMP/runtimes.json" <<'PY'
          import json, re, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          candidates = [
              item for item in data["runtimes"]
              if item.get("isAvailable")
              and item.get("identifier", "").startswith(
                  "com.apple.CoreSimulator.SimRuntime.iOS-"
              )
          ]
          if not candidates:
              raise SystemExit("No available iOS Simulator runtime")
          def version(item):
              return tuple(int(value) for value in re.findall(r"\d+", item["version"]))
          print(max(candidates, key=version)["identifier"])
          PY
          )"
          DEVICE_TYPE_ID="$(python3 - "$RUNNER_TEMP/device-types.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          ipads = [item for item in data["devicetypes"] if item["name"].startswith("iPad")]
          if not ipads:
              raise SystemExit("No iPad Simulator device type")
          preferred = sorted(
              ipads,
              key=lambda item: (
                  "11-inch" not in item["name"],
                  "Pro" not in item["name"],
                  item["name"],
              ),
          )
          print(preferred[0]["identifier"])
          PY
          )"
          DEVICE_ID="$(xcrun simctl create "Assignment App CI iPad" "$DEVICE_TYPE_ID" "$RUNTIME_ID")"
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Run iPad unit tests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project native/apple/AssignmentApp2.xcodeproj \
            -scheme AssignmentApp2 \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}" \
            -derivedDataPath "$ASSIGNMENT_DERIVED_DATA" \
            -resultBundlePath "$RUNNER_TEMP/ipad-unit.xcresult" \
            CODE_SIGNING_ALLOWED=NO test | tee "$RUNNER_TEMP/ipad-unit.log"

      - name: Run iPad UI smoke tests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project native/apple/AssignmentApp2.xcodeproj \
            -scheme AssignmentApp2UISmoke \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}" \
            -derivedDataPath "$ASSIGNMENT_DERIVED_DATA" \
            -resultBundlePath "$RUNNER_TEMP/ipad-ui.xcresult" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO test | tee "$RUNNER_TEMP/ipad-ui.log"

      - name: Run Mac Catalyst unit tests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project native/apple/AssignmentApp2.xcodeproj \
            -scheme AssignmentApp2 \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64,variant=Mac Catalyst' \
            -derivedDataPath "$ASSIGNMENT_DERIVED_DATA" \
            -resultBundlePath "$RUNNER_TEMP/catalyst-unit.xcresult" \
            CODE_SIGNING_ALLOWED=NO test | tee "$RUNNER_TEMP/catalyst-unit.log"

      - name: Package and launch-smoke Mac Catalyst
        shell: bash
        env:
          ASSIGNMENT_REQUIRE_CLEAN_TREE: "1"
          ASSIGNMENT_IPAD_TESTS: passed
          ASSIGNMENT_IPAD_UI_TESTS: passed
          ASSIGNMENT_CATALYST_TESTS: passed
        run: ./native/apple/package-catalyst.sh

      - name: Upload Apple package and test evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: assignment-app-apple-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/apple/debug-*
            ${{ runner.temp }}/ipad-unit.xcresult
            ${{ runner.temp }}/ipad-ui.xcresult
            ${{ runner.temp }}/catalyst-unit.xcresult
            ${{ runner.temp }}/*.log

      - name: Upload Apple failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: assignment-app-apple-diagnostics-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/apple/debug-*/logs/**
            ${{ runner.temp }}/ipad-unit.xcresult
            ${{ runner.temp }}/ipad-ui.xcresult
            ${{ runner.temp }}/catalyst-unit.xcresult
            ${{ runner.temp }}/*.log

      - name: Shut down the simulator
        if: always()
        run: xcrun simctl shutdown "${{ steps.simulator.outputs.device_id }}" || true
