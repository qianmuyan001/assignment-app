name: Apple iPad and Catalyst

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    # The project is authored by Xcode 27 (objectVersion 110). GitHub's
    # macos-26 image currently selects Xcode 26.x, so use the dedicated
    # arm64 Xcode 27 preview image until that toolchain becomes GA.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Record Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          echo "ASSIGNMENT_DERIVED_DATA=$RUNNER_TEMP/assignment-app-derived-data" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun swift --version
          xcodebuild -showsdks

      - name: Check cross-platform version metadata
        run: python3 scripts/check_version_sync.py

      - name: Create a disposable iPad simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          python3 native/apple/scripts/ipad-simulator.py create \
            --state "$RUNNER_TEMP/ipad-simulator.json" | tee "$RUNNER_TEMP/ipad-simulator.log"

      - name: Run iPad unit tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project native/apple/AssignmentApp2.xcodeproj \
            -scheme AssignmentApp2 \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}" \
            -derivedDataPath "$ASSIGNMENT_DERIVED_DATA" \
            -resultBundlePath "$RUNNER_TEMP/ipad-unit.xcresult" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO test | tee "$RUNNER_TEMP/ipad-unit.log"

      - name: Run iPad UI smoke tests
        shell: bash
        run: |
          set -euo pipefail
          python3 native/apple/scripts/ipad-simulator.py ready \
            --state "$RUNNER_TEMP/ipad-simulator.json"
          xcodebuild \
            -project native/apple/AssignmentApp2.xcodeproj \
            -scheme AssignmentApp2UISmoke \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}" \
            -derivedDataPath "$ASSIGNMENT_DERIVED_DATA" \
            -resultBundlePath "$RUNNER_TEMP/ipad-ui.xcresult" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO test | tee "$RUNNER_TEMP/ipad-ui.log"

      - name: Run Mac Catalyst unit tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project native/apple/AssignmentApp2.xcodeproj \
            -scheme AssignmentApp2 \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64,variant=Mac Catalyst' \
            -derivedDataPath "$ASSIGNMENT_DERIVED_DATA" \
            -resultBundlePath "$RUNNER_TEMP/catalyst-unit.xcresult" \
            CODE_SIGNING_ALLOWED=NO test | tee "$RUNNER_TEMP/catalyst-unit.log"

      - name: Package and launch-smoke Mac Catalyst
        shell: bash
        env:
          ASSIGNMENT_REQUIRE_CLEAN_TREE: "1"
          ASSIGNMENT_IPAD_TESTS: passed
          ASSIGNMENT_IPAD_UI_TESTS: passed
          ASSIGNMENT_CATALYST_TESTS: passed
        run: ./native/apple/package-catalyst.sh

      - name: Upload Apple package and test evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: assignment-app-apple-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/apple/debug-*
            ${{ runner.temp }}/ipad-unit.xcresult
            ${{ runner.temp }}/ipad-ui.xcresult
            ${{ runner.temp }}/catalyst-unit.xcresult
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/ipad-simulator.json

      - name: Upload Apple failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: assignment-app-apple-diagnostics-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/apple/debug-*/logs/**
            ${{ runner.temp }}/ipad-unit.xcresult
            ${{ runner.temp }}/ipad-ui.xcresult
            ${{ runner.temp }}/catalyst-unit.xcresult
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/ipad-simulator.json

      - name: Shut down and delete the owned simulator
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 native/apple/scripts/ipad-simulator.py delete \
            --state "$RUNNER_TEMP/ipad-simulator.json"
