name: Catalyst deadlock diagnosis (not release evidence)
on:
  push:
    branches: [qianmuyan001/apple-catalyst-diagnostics-20260921]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: xcode-27
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        scope: [all, without-read-gate]
    steps:
      - uses: actions/checkout@v4
      - name: Run original Catalyst tests with bounded stack capture
        env:
          DIAGNOSTIC_SCOPE: ${{ matrix.scope }}
        run: python3 native/apple/scripts/diagnose-catalyst.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalyst-diagnostic-${{ matrix.scope }}-${{ github.sha }}
          path: ${{ runner.temp }}/catalyst-diagnostic/**
          retention-days: 7
