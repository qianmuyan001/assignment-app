name: Python quality

on:
  push:
  pull_request:

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip install "pylint>=3.3,<5"
    - name: Check Python errors with Pylint
      run: python -m pylint --errors-only $(git ls-files '*.py')
    - name: Run shared contract tests
      run: python -m unittest discover -s shared/tests -v
