<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment App</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="scene" aria-hidden="true">
      <div class="glass-rail rail-one"></div>
      <div class="glass-rail rail-two"></div>
      <div class="beam beam-green"></div>
      <div class="beam beam-cyan"></div>
      <div class="scanline"></div>
    </div>

    <main class="page">
      <header class="page-header glass-panel">
        <div class="brand-area">
          <span class="brand-mark" aria-hidden="true">A</span>
          <div>
            <p class="eyebrow">Local assignment workspace</p>
            <h1>Assignment App</h1>
          </div>
        </div>

        <div class="header-actions">
          <button id="open-add-button" type="button" class="primary-button header-add-button">
            <span class="button-icon" aria-hidden="true">+</span>
            Add Assignment
          </button>

          <button id="open-org-button" type="button" class="secondary-button header-manage-button">
            Manage Organization
          </button>

          <div class="command-strip" aria-label="Assignment summary">
            <div class="strip-item">
              <span class="strip-value" id="total-count">0</span>
              <span class="strip-label">Total</span>
            </div>
            <div class="strip-item">
              <span class="strip-value" id="open-count">0</span>
              <span class="strip-label">Open</span>
            </div>
            <div class="strip-item accent">
              <span class="strip-value" id="today-count">0</span>
              <span class="strip-label">Today</span>
            </div>
            <div class="strip-item">
              <span class="strip-value" id="week-count">0</span>
              <span class="strip-label">Week</span>
            </div>
          </div>
        </div>
      </header>

      <section class="app-workspace">
        <section class="section flow-panel glass-panel">
          <div class="list-header">
            <div>
              <p class="eyebrow">Cover Flow</p>
              <h2>Assignments</h2>
            </div>
            <button id="refresh-button" type="button" class="secondary-button icon-button" aria-label="Refresh assignments" title="Refresh">
              <span class="refresh-glyph" aria-hidden="true"></span>
            </button>
          </div>

          <div class="filters">
            <label>
              Status
              <select id="status-filter">
                <option value="all">all</option>
                <option value="todo">todo</option>
                <option value="in_progress">in_progress</option>
                <option value="done">done</option>
              </select>
            </label>

            <label>
              Course
              <select id="course-filter">
                <option value="all">all courses</option>
              </select>
            </label>

            <label class="search-control">
              Search
              <input id="search-box" type="search" placeholder="Search assignments" />
            </label>

            <button id="clear-filters-button" type="button" class="secondary-button">
              Clear Filters
            </button>
          </div>

          <p id="error-message" class="error-message" role="alert"></p>

          <div class="flow-toolbar" aria-label="Assignment carousel controls">
            <button id="previous-card-button" type="button" class="secondary-button icon-button" aria-label="Previous assignment" title="Previous">
              <span aria-hidden="true">&lt;</span>
            </button>
            <div id="flow-position" class="flow-position">0 / 0</div>
            <button id="next-card-button" type="button" class="secondary-button icon-button" aria-label="Next assignment" title="Next">
              <span aria-hidden="true">&gt;</span>
            </button>
          </div>

          <div class="flow-stage" aria-label="3D assignment shelf">
            <div class="orbit-line" aria-hidden="true"></div>
            <div id="cover-flow" class="cover-flow" tabindex="0" aria-live="polite"></div>
            <p id="flow-empty" class="empty-message flow-empty" hidden>No assignments yet.</p>
          </div>
        </section>

        <aside class="section detail-panel glass-panel" id="detail-panel">
          <div class="section-heading">
            <p class="eyebrow">Extracted Card</p>
            <h2>Task Details</h2>
          </div>
          <div id="selected-detail" class="selected-detail"></div>
        </aside>
      </section>
    </main>

    <dialog id="assignment-dialog" class="add-dialog glass-panel" aria-labelledby="add-dialog-title">
      <div class="dialog-header">
        <div>
          <p class="eyebrow">Capture</p>
          <h2 id="add-dialog-title">Add Assignment</h2>
        </div>
        <button id="close-add-button" type="button" class="secondary-button icon-button" aria-label="Close add assignment" title="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>

      <form id="assignment-form" class="assignment-form">
        <label>
          Existing Course
          <select id="course-picker" name="course_picker">
            <option value="">— type a new course —</option>
          </select>
        </label>

        <label>
          Course Name
          <input id="course-name" name="course_name" type="text" required />
        </label>

        <label>
          Title
          <input id="title" name="title" type="text" required />
        </label>

        <label>
          Due Date
          <input id="due-date" name="due_date" type="datetime-local" required />
        </label>

        <label>
          Priority
          <select id="priority" name="priority">
            <option value="low">low</option>
            <option value="medium" selected>medium</option>
            <option value="high">high</option>
          </select>
        </label>

        <label>
          Source Name
          <input id="source-name" name="source_name" type="text" />
        </label>

        <label class="full-width">
          Description
          <textarea id="description" name="description" rows="3"></textarea>
        </label>

        <label class="full-width">
          Source URL
          <input id="source-url" name="source_url" type="url" />
        </label>

        <label>
          Project
          <select id="project-picker" name="project_id">
            <option value="">— no project —</option>
          </select>
        </label>

        <fieldset class="tag-fieldset">
          <legend>Tags</legend>
          <div id="tag-checkboxes" class="tag-options"></div>
        </fieldset>

        <button type="submit" class="primary-button">
          <span class="button-icon" aria-hidden="true">+</span>
          Add Assignment
        </button>
      </form>
    </dialog>

    <dialog id="org-dialog" class="org-dialog glass-panel" aria-labelledby="org-dialog-title">
      <div class="dialog-header">
        <div>
          <p class="eyebrow">Organize</p>
          <h2 id="org-dialog-title">Manage Organization</h2>
        </div>
        <button id="close-org-button" type="button" class="secondary-button icon-button" aria-label="Close organization manager" title="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>

      <div class="org-tabs" role="tablist" aria-label="Organization sections">
        <button type="button" class="org-tab is-active" data-org-tab="courses" role="tab">Courses</button>
        <button type="button" class="org-tab" data-org-tab="projects" role="tab">Projects</button>
        <button type="button" class="org-tab" data-org-tab="tags" role="tab">Tags</button>
      </div>

      <section class="org-panel" data-org-panel="courses">
        <form id="org-course-form" class="org-add-form">
          <input id="org-course-name" name="name" type="text" placeholder="New course name" required />
          <input id="org-course-teacher" name="teacher" type="text" placeholder="Teacher (optional)" />
          <input id="org-course-color" name="color_hex" type="text" placeholder="#36e286" pattern="#[0-9A-Fa-f]{6}" maxlength="7" />
          <button type="submit" class="primary-button">Add Course</button>
        </form>
        <ul id="org-course-list" class="org-list"></ul>
      </section>

      <section class="org-panel" data-org-panel="projects" hidden>
        <form id="org-project-form" class="org-add-form">
          <input id="org-project-name" name="name" type="text" placeholder="New project name" required />
          <select id="org-project-course" name="course_id">
            <option value="">— no course —</option>
          </select>
          <button type="submit" class="primary-button">Add Project</button>
        </form>
        <ul id="org-project-list" class="org-list"></ul>
      </section>

      <section class="org-panel" data-org-panel="tags" hidden>
        <form id="org-tag-form" class="org-add-form">
          <input id="org-tag-name" name="name" type="text" placeholder="New tag name" required />
          <input id="org-tag-color" name="color_hex" type="text" placeholder="#62d7f7" pattern="#[0-9A-Fa-f]{6}" maxlength="7" />
          <button type="submit" class="primary-button">Add Tag</button>
        </form>
        <ul id="org-tag-list" class="org-list"></ul>
      </section>
    </dialog>

    <script src="/static/script.js"></script>
  </body>
</html>
